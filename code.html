<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SampleWebsite</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#0f0f0f] text-white">
<div class="max-w-[420px] mx-auto min-h-screen bg-[#1a1a1a]">
<div class="bg-gradient-to-br from-orange-500 to-red-600 p-6">
  <div class="flex justify-between">
    <div>
      <h1 class="text-3xl font-extrabold leading-tight">Paresan ni Mang Juan</h1>
      <p class="text-orange-100 mt-1 text-sm">Almanza, Las Pinas - 30 mins delivery</p>
    </div>
    <div class="bg-white text-black text-xs font-bold px-3 py-1 rounded-full h-fit">OPEN</div>
  </div>
</div>
<div class="bg-[#252525] p-3 text-center text-sm text-gray-300 flex justify-center gap-4">
  <span>4.9 stars (127 reviews)</span>
  <span>500+ orders</span>
</div>
<div class="p-5 space-y-4" id="menu">
  <h2 class="font-bold text-lg">Pili ka, Bossing</h2>
</div>
<div class="sticky bottom-0 bg-[#1a1a1a] border-t border-[#333] p-5">
  <div class="flex justify-between text-lg mb-3">
    <span>Total:</span>
    <span class="font-extrabold text-orange-400" id="total">P0</span>
  </div>
  <button onclick="order()" class="w-full bg-orange-500 hover:bg-orange-600 text-black font-extrabold py-4 rounded-xl text-lg">
    ORDER VIA MESSENGER
  </button>
  <p class="text-[11px] text-center text-gray-500 mt-2">GCash / COD - No extra fee</p>
</div>
</div>
<script>
const items = [
  {name:"Beef Pares Overload", price:120, best:true, desc:"With egg + chicharon"},
  {name:"Pares Mami", price:110, desc:"Mainit na sabaw"},
  {name:"Extra Rice", price:15, desc:"Unli? Add lang"},
  {name:"Coke Sakto", price:20, desc:"Pang tulak"},
];
let cart = {};
let total = 0;
const menuDiv = document.getElementById('menu');
items.forEach((it, i)=>{
  menuDiv.innerHTML += `
  <div class="bg-[#252525] p-4 rounded-2xl flex justify-between items-center">
    <div>
      <div class="font-bold flex gap-2 items-center">${it.name} ${it.best?'<span class="bg-orange-500 text-black text-[9px] px-2 py-0.5 rounded-full font-bold">BESTSELLER</span>':''}</div>
      <div class="text-xs text-gray-400">${it.desc}</div>
      <div class="text-orange-400 font-bold mt-1">P${it.price}</div>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="change(${i},-1)" class="w-8 h-8 bg-[#333] rounded-full">-</button>
      <span id="q${i}" class="w-4 text-center">0</span>
      <button onclick="change(${i},1)" class="w-8 h-8 bg-white text-black rounded-full font-bold">+</button>
    </div>
  </div>`;
});
function change(i,d){
  cart[i] = Math.max(0,(cart[i]||0)+d);
  document.getElementById('q'+i).innerText = cart[i];
  calc();
}
function calc(){
  total = 0;
  for(let k in cart) total += cart[k]*items[k].price;
  document.getElementById('total').innerText = 'P'+total;
}
function order(){
  if(total==0) return alert('Pili ka muna boss!');
  let msg = 'Hello! Order po:%0A';
  for(let k in cart) if(cart[k]>0) msg+=`-${cart[k]}x ${items[k].name}%0A`;
  msg+=`Total: P${total}%0A%0AName/Address: `;
  window.open('https://m.me/joshynero.sordilla.1?text='+msg, '_blank');
}
</script>
</body>
</html>
