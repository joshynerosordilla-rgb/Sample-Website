<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pares ni Josh - Las Piñas | Order Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system,BlinkMacSystemFont,sans-serif}
body{background:#fff7ed}
.header{background:linear-gradient(135deg,#dc2626,#991b1b);color:white;padding:25px;text-align:center}
.header h1{font-size:28px}
.header p{opacity:0.9;margin-top:5px}
.container{max-width:480px;margin:0 auto;padding:15px}
.card{background:white;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,0.08);display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:16px}
.card span{color:#dc2626;font-weight:bold}
.btn{background:#dc2626;color:white;border:none;padding:8px 16px;border-radius:20px;font-weight:bold}
.cart{position:sticky;bottom:15px;background:#111827;color:white;border-radius:20px;padding:16px;margin-top:20px}
.cart button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin-top:8px;font-size:15px}
.order{background:#dc2626;color:white}
.gcash{background:white;color:#0072ff;display:flex;align-items:center;justify-content:center;gap:6px}
.payinfo{background:#f0f9ff;border:1px dashed #0072ff;border-radius:12px;padding:10px;margin:10px 0;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="header">
<h1>🔥 PARES NI JOSH</h1>
<p>Las Piñas • Open 10AM-10PM • Free Delivery Nearby</p>
</div>

<div class="container">
<div id="menu"></div>

<div class="payinfo">
💙 <b>GCash:</b> 09242337211<br>Josh Ynero Sordilla<br><i>Send screenshot after payment</i>
</div>

<div class="cart">
<div style="display:flex;justify-content:space-between"><span id="count">0 items</span><b id="total">P0</b></div>
<button class="order" onclick="orderMessenger()">📩 ORDER VIA MESSENGER</button>
<button class="gcash" onclick="orderGCash()">💙 ORDER + PAY GCASH</button>
</div>
</div>

<script>
let items={
1:{name:"Beef Pares",price:120,emoji:"🍖"},
2:{name:"Pares + Rice + Egg",price:150,emoji:"🍳"},
3:{name:"Extra Rice",price:20,emoji:"🍚"},
4:{name:"Extra Sabaw",price:15,emoji:"🥣"},
5:{name:"Softdrinks",price:25,emoji:"🥤"}
};
let cart={},total=0;
let menuDiv=document.getElementById('menu');
for(let id in items){
cart[id]=0;
menuDiv.innerHTML+=`<div class="card"><div><h3>${items[id].emoji} ${items[id].name}</h3><span>P${items[id].price}</span></div><div><button class="btn" onclick="add(${id},-1)">-</button> <span id="q${id}">0</span> <button class="btn" onclick="add(${id},1)">+</button></div></div>`;
}
function add(id,n){
cart[id]=Math.max(0,cart[id]+n);
document.getElementById('q'+id).textContent=cart[id];
update();
}
function update(){
total=0;let c=0;
for(let id in cart){total+=cart[id]*items[id].price;c+=cart[id];}
document.getElementById('total').textContent='P'+total;
document.getElementById('count').textContent=c+' items';
}
function getMsg(){
if(total==0){alert('Pili ka muna boss!');return null;}
let msg='Hello Pares ni Josh! Order po:\n\n';
for(let id in cart) if(cart[id]>0) msg+=`${cart[id]}x ${items[id].name} - P${cart[id]*items[id].price}\n`;
msg+=`\nTotal: P${total}\n\nName:\nAddress:\nPayment: `;
return msg;
}
function orderMessenger(){
let msg=getMsg(); if(!msg) return;
msg+='COD / Messenger';
let url='https://m.me/josh.sordilla?text='+encodeURIComponent(msg);
window.location.href=url;
}
function orderGCash(){
let msg=getMsg(); if(!msg) return;
msg+=`GCash - 09242337211 Josh Ynero Sordilla (P${total} sent)`;
let url='https://m.me/joshynero.sordilla.1?text='+encodeURIComponent(msg);
window.location.href=url;
}
</script>
</body>
</html>
